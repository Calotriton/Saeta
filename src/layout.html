  <script>
    // Apply saved theme/lang before paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('saeta.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('saeta.lang');
        if (l) document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>
